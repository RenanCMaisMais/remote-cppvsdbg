[package]
name = "vsdbg"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = 'abort'

[[bin]]
name = "spawner"
path = "src/bin/spawner.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
windows = { version = "0.62.2", features = [
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_Foundation",
] }